services:
  - type: web
    name: neersense
    runtime: node
    env: static
    region: singapore
    branch: main
    buildCommand: npm install --include=dev && npx vite build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/villages
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_USE_FIRESTORE
        value: false
      - key: VITE_USE_FIREBASE_EMULATOR
        value: false
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyAlpmIwg9b3TX4CmgW_EtUHZYPDKVDH7OA
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: neersense-1.firebaseapp.com
      - key: VITE_FIREBASE_DATABASE_URL
        value: https://neersense-1-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: VITE_FIREBASE_PROJECT_ID
        value: neersense-1
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: neersense-1.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "1077778375818"
      - key: VITE_FIREBASE_APP_ID
        value: 1:1077778375818:web:a09a00788c706183f17973
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: G-0VC4E3HB5L
